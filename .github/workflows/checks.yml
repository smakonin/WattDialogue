name: Prototype checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_BACKUP: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repo_safety.py
      - run: node --check web/app.js
      - run: node study/offline-display/test-review.js
      - run: python study/offline-display/verify-review.py
      - name: Verify study rebuild is reproducible
        working-directory: study/offline-display
        run: |
          python build_corpus.py
          python build_orientation.py
          python make_schemas.py
          python build.py
          node test-review.js
          python verify-review.py
          git diff --exit-code -- .
